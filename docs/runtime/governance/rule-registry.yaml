rules:
  - id: git_preflight
    triggerPhases:
      - BEFORE_RUN
    evidence:
      - docs/process/git/preflights/<ticket>.env
    evaluationType: deterministic
    deterministicCheck: preflight_token
    enforcementMode: hard
    enabledByDefault: true

  - id: postflight_evidence
    triggerPhases:
      - AFTER_RUN
    evidence:
      - docs/process/tests/<ticket>.md
    evaluationType: deterministic
    deterministicCheck: postflight_report
    enforcementMode: hard
    enabledByDefault: true

  - id: improvement_loop
    triggerPhases:
      - AFTER_RUN
    evidence:
      - docs/process/retrospectives/**
      - docs/knowledge/lessons-learned/**
    evaluationType: deterministic
    deterministicCheck: improvement_artifact
    enforcementMode: soft
    enabledByDefault: true

  - id: required_agent_usage
    triggerPhases:
      - AFTER_STEP
    evidence:
      - agent.started events
    evaluationType: deterministic
    deterministicCheck: agent_usage_events
    enforcementMode: soft
    enabledByDefault: true

  - id: required_pipeline_usage
    triggerPhases:
      - AFTER_STEP
    evidence:
      - stage.started events
    evaluationType: deterministic
    deterministicCheck: pipeline_usage_events
    enforcementMode: soft
    enabledByDefault: true

  - id: cost_guard_light
    triggerPhases:
      - AFTER_RUN
    evidence:
      - token telemetry
    evaluationType: deterministic
    deterministicCheck: cost_guard_tokens
    enforcementMode: advisory
    enabledByDefault: true
