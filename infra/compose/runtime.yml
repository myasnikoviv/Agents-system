services:
  control-api:
    build:
      context: ../../
      dockerfile: apps/control-api/Dockerfile
    environment:
      AUTH_MODE: ${AUTH_MODE:-optional}
      COCKPIT_SECRETS_BACKEND: ${COCKPIT_SECRETS_BACKEND:-sqlite}
      COCKPIT_OBJECT_STORAGE_BACKEND: ${COCKPIT_OBJECT_STORAGE_BACKEND:-sqlite}
      RUNTIME_SHARED_DISPATCH_QUEUE_BACKEND: ${RUNTIME_SHARED_DISPATCH_QUEUE_BACKEND:-sqlite}
      RUNTIME_SHARED_WORKER_STATE_BACKEND: ${RUNTIME_SHARED_WORKER_STATE_BACKEND:-sqlite}
    ports:
      - "3001:3001"

  runtime-engine:
    build:
      context: ../../
      dockerfile: apps/runtime-engine/Dockerfile
    environment:
      AUTH_MODE: ${AUTH_MODE:-optional}
      COCKPIT_SECRETS_BACKEND: ${COCKPIT_SECRETS_BACKEND:-sqlite}
      COCKPIT_OBJECT_STORAGE_BACKEND: ${COCKPIT_OBJECT_STORAGE_BACKEND:-sqlite}
      RUNTIME_SHARED_DISPATCH_QUEUE_BACKEND: ${RUNTIME_SHARED_DISPATCH_QUEUE_BACKEND:-sqlite}
      RUNTIME_SHARED_WORKER_STATE_BACKEND: ${RUNTIME_SHARED_WORKER_STATE_BACKEND:-sqlite}
      AGENT_SYSTEM_BACKEND_PORT: 3002
    ports:
      - "3002:3002"
