worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream client_app {
    server host.docker.internal:4173;
  }

  upstream control_api {
    server host.docker.internal:3001;
  }

  upstream runtime_engine {
    server host.docker.internal:3002;
  }

  server {
    listen 8080;
    server_name _;

    # Client app public entrypoint.
    location / {
      proxy_pass http://client_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Control API public path.
    location /api/ {
      proxy_pass http://control_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime engine path with /runtime prefix stripped.
    location /runtime/ {
      rewrite ^/runtime/(.*)$ /$1 break;
      proxy_pass http://runtime_engine;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
