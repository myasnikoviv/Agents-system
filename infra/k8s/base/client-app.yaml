apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-app
  labels:
    app.kubernetes.io/name: client-app
    app.kubernetes.io/part-of: agent-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: client-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client-app
        app.kubernetes.io/part-of: agent-system
    spec:
      containers:
        - name: client-app
          image: ghcr.io/myasnikoviv/agents-system/client-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: client-app
  labels:
    app.kubernetes.io/name: client-app
    app.kubernetes.io/part-of: agent-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: client-app
  ports:
    - name: http
      port: 80
      targetPort: http
