apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-system-ingress
  labels:
    app.kubernetes.io/part-of: agent-system
spec:
  ingressClassName: nginx
  rules:
    - host: app.agent-system.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-app
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control-api
                port:
                  number: 3001
