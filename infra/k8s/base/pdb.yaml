apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-api
  labels:
    app.kubernetes.io/name: control-api
    app.kubernetes.io/part-of: agent-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runtime-engine
  labels:
    app.kubernetes.io/name: runtime-engine
    app.kubernetes.io/part-of: agent-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-engine
